[project]
name = "opspilot"
version = "0.1.0"
description = "AI-powered production incident investigator. Ask your infrastructure why it is broken."
readme = "README.md"
license = "MIT"
authors = [
    { name = "softjapan", email = "softjapan@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
    "pymysql>=1.1",
    "psutil>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.34"]
openai = ["openai>=1.40"]

[project.scripts]
opspilot = "opspilot.cli.main:app"
opspilot-api = "opspilot.api.__main__:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
