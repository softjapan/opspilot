log_format opspilot '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                     'rt=$request_time urt="$upstream_response_time"';

server {
    listen 80;

    # Declaring access_log/error_log inside the server block replaces (does
    # not accumulate with) the base image's http-level defaults, so this
    # server only ever writes the "opspilot" format.
    access_log /var/log/nginx/access.log opspilot;
    error_log /var/log/nginx/error.log warn;

    location /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    # Deliberately proxies to a port nothing listens on, forcing a 502 —
    # this is the "why is /api/search down" scenario OpsPilot investigates.
    location /api/search {
        proxy_pass http://127.0.0.1:9/;
        proxy_connect_timeout 1s;
    }
}
